[package]
name = "savia-companion"
version = "0.1.0"
description = "Native host for Savia Companion's manual audio capture"
authors = ["Savia contributors"]
edition = "2021"
license-file = "../../../LICENSE"
build = "build.rs"

[lib]
name = "savia_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "savia-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
base64 = "=0.22.1"
cpal = "=0.16.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.12.1", features = [] }
tempfile = "=3.27.0"
ruopus = "=0.1.2"
rubato = "=5.0.1"
url = "=2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
# Without this feature keyring falls back to an in-memory mock and remembered
# credentials would never survive a restart.
keyring = { version = "=3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "=0.24.0"
# Without this feature keyring falls back to an in-memory mock and remembered
# credentials would never survive a restart.
keyring = { version = "=3.6.3", features = ["windows-native"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

# ruopus is a software encoder; optimize it for interactive debug builds too so
# finalizing a 60-second capture does not block the native host for tens of seconds.
[profile.dev.package.ruopus]
opt-level = 2

[profile.test.package.ruopus]
opt-level = 2
