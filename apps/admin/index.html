<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Savia</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32-v2.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16-v2.png" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon-v2.png"
    />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Savia" />
    <meta name="application-name" content="Savia" />
    <meta name="msapplication-TileColor" content="#0d9488" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("savia.appearance");
          if (!raw) return;
          var appearance = JSON.parse(raw);
          if (appearance && appearance.colorTheme) {
            document.documentElement.dataset.colorTheme = appearance.colorTheme;
          }
          if (
            appearance &&
            (appearance.theme === "dark" ||
              (appearance.theme === "system" &&
                window.matchMedia("(prefers-color-scheme: dark)").matches))
          ) {
            document.documentElement.classList.add("dark");
          } else if (
            appearance &&
            (appearance.theme === "light" ||
              (appearance.theme === "system" &&
                !window.matchMedia("(prefers-color-scheme: dark)").matches))
          ) {
            document.documentElement.classList.remove("dark");
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
