name: savia-cloudflare
description: Savia Cloudflare infrastructure resources and generated Worker deployment configuration. Wrangler remains the sole Worker publisher.
runtime: nodejs
template:
  config:
    cloudflare:apiToken:
      description: Cloudflare API token (Workers + D1 + R2)
      secret: true
    savia-cloudflare:accountId:
      description: Cloudflare account ID
    savia-cloudflare:environment:
      description: preview or production
      default: preview
    savia-cloudflare:publicOrigin:
      description: Public HTTPS origin (must be isolated per environment)
    savia-cloudflare:documentsBucket:
      description: R2 documents bucket (must be isolated per environment)
    savia-cloudflare:pagesSearchIndex:
      description: Optional Vectorize index name (preview must use the preview index)
    savia-cloudflare:flowsEnabled:
      description: Provision isolated Savia Flows D1, KV, R2, and execution/dead-letter Queues
      default: false
    savia-cloudflare:flowsExecutionEnabled:
      description: Allow execution only after provisioning, secrets, recovery, and deployment checks pass
      default: false
