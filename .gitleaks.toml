title = "Savia public source secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic avatar integration test key"
condition = "AND"
paths = ['''^apps/api/test/account-avatar-auth\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^avatar-integration-test-secret-at-least-32-characters$''']

[[allowlists]]
description = "Synthetic CRM integration test key"
condition = "AND"
paths = ['''^apps/api/test/dynamic-crm\.test\.ts$''']
regexTarget = "secret"
regexes = ['''^integration-test-key-with-at-least-32-characters$''']

[[allowlists]]
description = "Literal YOUR_SECRET placeholder in workflow webhook examples"
condition = "AND"
paths = ['''^docs/workflows\.md$''', '''^apps/admin/src/features/crm-engine/workflow-webhooks\.tsx$''']
regexTarget = "secret"
regexes = ['''^(?:Bearer )?YOUR_SECRET$''']

[[allowlists]]
description = "Booking design prose describing ineligible professionals"
condition = "AND"
paths = ['''^docs/superpowers/specs/2026-10-03-tenant-booking-design\.md$''']
regexTarget = "secret"
regexes = ['''^foreign/disabled$''']
