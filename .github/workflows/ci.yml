      - name: Install locked infrastructure dependencies
        run: npm ci --prefix infra/pulumi --ignore-scripts

      - name: Run contract tests
        run: pnpm run test:contracts

      - name: Run offline Flows recovery contracts for infrastructure changes
        if: needs.changes.outputs.ci_kind == 'infrastructure'
        run: node --test --test-concurrency=1 scripts/flows-*.test.mjs scripts/flows-maintenance/*.test.mjs scripts/encrypt-flows-backup.test.mjs scripts/verify-flows-preview.test.mjs

