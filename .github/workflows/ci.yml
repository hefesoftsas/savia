name: Savia CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: savia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    name: Admin unit tests (shard 1/6)
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Admin unit tests
        run: VITEST_SHARD_ARGS='--shard 1/6' pnpm run test:unit:admin

