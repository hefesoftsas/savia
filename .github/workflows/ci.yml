name: Savia CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: savia-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify affected work
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      flows: ${{ steps.plan.outputs.flows }}
      plugins: ${{ steps.plan.outputs.plugins }}
      plugin_only: ${{ steps.plan.outputs.plugin_only }}
      ci_kind: ${{ steps.plan.outputs.ci_kind }}
      ci_flows: ${{ steps.plan.outputs.ci_flows }}
    steps:
      - name: Check out source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify changes with trusted base code
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          else
            BASE_SHA=""
          fi

          trusted_script="$RUNNER_TEMP/preview-change-plan.mjs"
          if [[ -n "$BASE_SHA" ]] && git show "$BASE_SHA:scripts/preview-change-plan.mjs" > "$trusted_script" 2>/dev/null; then
            node "$trusted_script" --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"
            ci_output="$RUNNER_TEMP/preview-change-plan-ci-output"
            rm -f "$ci_output"
            touch "$ci_output"
            if node "$trusted_script" --ci --base "$BASE_SHA" --head "$HEAD_SHA" --output "$ci_output" \
              && [[ "$(grep -c '^ci_kind=' "$ci_output")" == 1 ]] \
              && [[ "$(grep -c '^ci_flows=' "$ci_output")" == 1 ]] \
              && { { grep -Fxq 'ci_kind=full' "$ci_output" && grep -Fxq 'ci_flows=true' "$ci_output"; } || { grep -Exq 'ci_kind=(infrastructure|plugin|none)' "$ci_output" && grep -Fxq 'ci_flows=false' "$ci_output"; }; }; then
              cat "$ci_output" >> "$GITHUB_OUTPUT"
            else
              {
                echo 'ci_kind=full'
                echo 'ci_flows=true'
                echo 'reasons=["Trusted base classifier lacks CI classification; running full CI."]'
              } >> "$GITHUB_OUTPUT"
            fi
          else
            {
              echo 'kind=platform'
              echo 'flows=true'
              echo 'ci_kind=full'
              echo 'ci_flows=true'
              echo 'plugins=[]'
              echo 'plugin_only=false'
              echo 'reasons=["Trusted classifier or usable base revision unavailable; running full CI."]'
            } >> "$GITHUB_OUTPUT"
          fi

  plugin-validation:
    name: Validate changed plugins
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.plugin_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      CHANGED_PLUGINS: ${{ needs.changes.outputs.plugins }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin package checks and pack changed plugins
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';

          const plugins = JSON.parse(process.env.CHANGED_PLUGINS);
          for (const plugin of plugins) {
            const path = `${plugin.directory}/package.json`;
            let pkg;
            try { pkg = JSON.parse(readFileSync(path, 'utf8')); }
            catch { pkg = null; }
            if (pkg?.name) {
              for (const script of ['test', 'typecheck']) {
                if (!pkg.scripts?.[script]) continue;
                const run = spawnSync('pnpm', ['--filter', pkg.name, script], { stdio: 'inherit' });
                if (run.status !== 0) process.exit(run.status ?? 1);
              }
            }
            const pack = spawnSync('node', ['scripts/pack-store-plugin.mjs', plugin.directory], { stdio: 'inherit' });
            if (pack.status !== 0) process.exit(pack.status ?? 1);
          }
          NODE

