name: QuickJS hook labeled PR preview

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: quickjs-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.label.name == 'quickjs-preview' }}
    name: Deploy reviewed QuickJS preview
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: preview
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      PREVIEW_BRANCH: ${{ github.head_ref }}
      PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out pull request source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy explicitly labeled QuickJS branch preview
        run: node scripts/preview-deploy.mjs --branch "$PREVIEW_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify QuickJS preview through authenticated service
        run: node scripts/verify-quickjs-preview.mjs --branch "$PREVIEW_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record the deployed commit
        run: |
          test "$(git rev-parse HEAD)" = "$PREVIEW_SHA"
          printf 'QuickJS preview for labeled pull request #%s deployed at %s.\n' \
            "$PR_NUMBER" "$PREVIEW_SHA"
