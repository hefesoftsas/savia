name: Deploy Savia preview

on:
  workflow_run:
    workflows: [Savia CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: savia-preview
  cancel-in-progress: false

jobs:
  plan:
    name: Plan Preview release
    if: >-
      ${{ github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      kind: ${{ steps.plan.outputs.kind }}
      plugins: ${{ steps.plan.outputs.plugins }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - name: Check out tested source and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Reject superseded release plans
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare with the last successfully published ancestor
        id: plan
        run: node scripts/preview-release-plan.mjs
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    needs: plan
    if: >-
      ${{ needs.plan.outputs.kind == 'platform' &&
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository }}
    name: Deploy preview
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    environment:
      name: preview
      url: ${{ steps.infrastructure.outputs.public-origin }}
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Reject superseded deployments
        shell: bash
        run: |
          approved_sha="$(git rev-parse HEAD)"
          current_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$approved_sha" != "$current_sha" ]; then
            echo "::error::This commit has been superseded on main; refusing an outdated deployment."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load infrastructure stack outputs
        id: infrastructure
        uses: ./.github/actions/pulumi-infrastructure
        with:
          stack: preview
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          NANGO_JIRA_INTEGRATION_ID: ${{ vars.NANGO_JIRA_INTEGRATION_ID }}
          NANGO_GITHUB_INTEGRATION_ID: ${{ vars.NANGO_GITHUB_INTEGRATION_ID }}
          NANGO_ZOOM_INTEGRATION_ID: ${{ vars.NANGO_ZOOM_INTEGRATION_ID }}
          NANGO_SLACK_INTEGRATION_ID: ${{ vars.NANGO_SLACK_INTEGRATION_ID }}
          NANGO_MICROSOFT_TEAMS_INTEGRATION_ID: ${{ vars.NANGO_MICROSOFT_TEAMS_INTEGRATION_ID }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}

      - name: Validate planned Flows settings and stable keys before mutation
        run: node infra/pulumi/flows-preflight.mjs
        env:
          SAVIA_FLOWS_BRIDGE_SECRET: ${{ secrets.SAVIA_FLOWS_BRIDGE_SECRET }}
          SAVIA_FLOWS_JWT_SECRET: ${{ secrets.SAVIA_FLOWS_JWT_SECRET }}
          SAVIA_FLOWS_SECRET_MASTER_KEY: ${{ secrets.SAVIA_FLOWS_SECRET_MASTER_KEY }}
          SAVIA_FLOWS_FORM_SIGNING_KEY: ${{ secrets.SAVIA_FLOWS_FORM_SIGNING_KEY }}
          SAVIA_FLOWS_BACKUP_KEY: ${{ secrets.SAVIA_FLOWS_BACKUP_KEY }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}

      - name: Verify isolated preview resources before any mutation
        run: node scripts/verify-preview-resources.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SAVIA_AUTH_D1_ID: ${{ env.SAVIA_AUTH_D1_ID }}
          SAVIA_DOMAIN_D1_ID: ${{ env.SAVIA_DOMAIN_D1_ID }}
          SAVIA_DOCUMENTS_BUCKET: ${{ env.SAVIA_DOCUMENTS_BUCKET }}

      - name: Capture preview Worker recovery state
        id: capture_recovery
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        run: node scripts/flows-preview-recovery.mjs --action capture --environment preview --metadata "$RUNNER_TEMP/flows-preview-recovery.json" --apply
        env:
          SAVIA_DEPLOY_ENVIRONMENT: preview
          SAVIA_FLOWS_PROVISIONED: ${{ env.SAVIA_FLOWS_PROVISIONED }}
          SAVIA_FLOWS_RESOURCES: ${{ env.SAVIA_FLOWS_RESOURCES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Existing deployments are paused before copying data. First provisioning
      # has no existing Flows state and skips these stages entirely.
      - name: Deploy savia backup coordinator
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          workingDirectory: apps/backup-coordinator
          wranglerVersion: 4.127.1

      - name: Pause Savia writes for persistence backup
        id: pause_agencies
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc --var SAVIA_MAINTENANCE:true
          workingDirectory: apps/api
          wranglerVersion: 4.127.1

      - name: Pause existing Flows for a coherent backup
        id: pause_flows
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc --var SAVIA_FLOWS_EXECUTION_ENABLED:false --var SAVIA_FLOWS_MAINTENANCE:true
          workingDirectory: apps/flows/api
          wranglerVersion: 4.127.1

      - name: Allow existing requests to drain
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        run: node --input-type=module -e 'await new Promise(resolve => setTimeout(resolve, 45000))'

      - name: Snapshot Flows Durable Object databases
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        run: node scripts/flows-maintenance.mjs --action backup --snapshot-file "$RUNNER_TEMP/flows-snapshot.json" --apply
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SAVIA_FLOWS_BRIDGE_SECRET: ${{ secrets.SAVIA_FLOWS_BRIDGE_SECRET }}

      - name: Back up all existing persistence before migrations
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        run: node infra/pulumi/backup.mjs --stack preview --apply --confirm-quiescent preview --flows-snapshot "$RUNNER_TEMP/flows-snapshot.json" --out-dir "$RUNNER_TEMP/flows-release-backup"
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          SAVIA_BACKUP_R2_FORCE_API: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Encrypt recovery archive
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        shell: bash
        run: |
          umask 077
          tar -czf "$RUNNER_TEMP/flows-release-backup.tar.gz" -C "$RUNNER_TEMP" flows-release-backup
          node scripts/encrypt-flows-backup.mjs --action encrypt --input "$RUNNER_TEMP/flows-release-backup.tar.gz" --output "$RUNNER_TEMP/flows-release-backup.enc"
          rm "$RUNNER_TEMP/flows-release-backup.tar.gz"
        env:
          SAVIA_FLOWS_BACKUP_KEY: ${{ secrets.SAVIA_FLOWS_BACKUP_KEY }}

      - name: Retain encrypted recovery archive
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flows-preview-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/flows-release-backup.enc
          if-no-files-found: error
          retention-days: 7

      # Vectorize is bootstrapped separately with Vectorize Write access.
      # Deployments bind the existing isolated index using the Worker token.
      - name: Apply infrastructure before Worker deployment
        run: node infra/pulumi/deploy-stack.mjs --stack preview --apply
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}

      - name: Render applied infrastructure outputs
        run: node infra/pulumi/render-from-outputs.mjs --stack preview
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          NANGO_JIRA_INTEGRATION_ID: ${{ vars.NANGO_JIRA_INTEGRATION_ID }}
          NANGO_GITHUB_INTEGRATION_ID: ${{ vars.NANGO_GITHUB_INTEGRATION_ID }}
          NANGO_ZOOM_INTEGRATION_ID: ${{ vars.NANGO_ZOOM_INTEGRATION_ID }}
          NANGO_SLACK_INTEGRATION_ID: ${{ vars.NANGO_SLACK_INTEGRATION_ID }}
          NANGO_MICROSOFT_TEAMS_INTEGRATION_ID: ${{ vars.NANGO_MICROSOFT_TEAMS_INTEGRATION_ID }}

      - name: Upload secrets using explicit environment configuration
        run: node scripts/upload-cloudflare-secrets.mjs
        env:
          SAVIA_DEPLOY_ENVIRONMENT: preview
          SAVIA_FLOWS_BRIDGE_SECRET: ${{ secrets.SAVIA_FLOWS_BRIDGE_SECRET }}
          SAVIA_FLOWS_JWT_SECRET: ${{ secrets.SAVIA_FLOWS_JWT_SECRET }}
          SAVIA_FLOWS_SECRET_MASTER_KEY: ${{ secrets.SAVIA_FLOWS_SECRET_MASTER_KEY }}
          SAVIA_FLOWS_FORM_SIGNING_KEY: ${{ secrets.SAVIA_FLOWS_FORM_SIGNING_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          SAVIA_MCP_SHARED_SECRET: ${{ secrets.SAVIA_MCP_SHARED_SECRET }}
          SAVIA_REQUEST_ENCRYPTION_KEY: ${{ secrets.SAVIA_REQUEST_ENCRYPTION_KEY }}
          EXTENSION_CONNECTIONS_ENCRYPTION_KEY: ${{ secrets.EXTENSION_CONNECTIONS_ENCRYPTION_KEY }}
          ASSISTANT_SETTINGS_ENCRYPTION_KEY: ${{ secrets.ASSISTANT_SETTINGS_ENCRYPTION_KEY }}
          CRM_INTEGRATION_KEY: ${{ secrets.CRM_INTEGRATION_KEY }}
          PLUGIN_REGISTRY_TENANTS: ${{ secrets.PLUGIN_REGISTRY_TENANTS }}
          NANGO_API_KEY: ${{ secrets.NANGO_API_KEY }}
          NANGO_FALLBACK_API_KEY: ${{ secrets.NANGO_FALLBACK_API_KEY }}
          NANGO_JIRA_INTEGRATION_ID: ${{ vars.NANGO_JIRA_INTEGRATION_ID }}
          NANGO_JIRA_REPORTING_CONNECTION_ID: ${{ secrets.NANGO_JIRA_REPORTING_CONNECTION_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          WHATSAPP_META_APP_SECRET: ${{ secrets.WHATSAPP_META_APP_SECRET }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          SQL_BRIDGE_URL: ${{ secrets.SQL_BRIDGE_URL }}
          SQL_BRIDGE_SECRET: ${{ secrets.SQL_BRIDGE_SECRET }}
          SAVIA_CHATGPT_CLIENT_ID: ${{ secrets.SAVIA_CHATGPT_CLIENT_ID }}
          SAVIA_CHATGPT_CLIENT_SECRET: ${{ secrets.SAVIA_CHATGPT_CLIENT_SECRET }}
          SAVIA_CHATGPT_TOKEN_AUTH_METHOD: ${{ vars.SAVIA_CHATGPT_TOKEN_AUTH_METHOD }}
          SAVIA_GOOGLE_CLIENT_ID: ${{ secrets.SAVIA_GOOGLE_CLIENT_ID }}
          SAVIA_GOOGLE_CLIENT_SECRET: ${{ secrets.SAVIA_GOOGLE_CLIENT_SECRET }}
          SAVIA_MICROSOFT_CLIENT_ID: ${{ secrets.SAVIA_MICROSOFT_CLIENT_ID }}
          SAVIA_MICROSOFT_CLIENT_SECRET: ${{ secrets.SAVIA_MICROSOFT_CLIENT_SECRET }}

      - name: Deploy private Savia FastMCP
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          workingDirectory: apps/mcp
          wranglerVersion: 4.127.1

      - name: Apply Savia domain migrations
        run: node scripts/apply-d1-migrations.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_DATABASE_ID: ${{ env.SAVIA_DOMAIN_D1_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy private QuickJS hook executor
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          workingDirectory: apps/hook-executor
          wranglerVersion: 4.127.1

      - name: Apply Flows D1 migrations
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply savia-flows-preview --remote --config wrangler.preview.jsonc
          workingDirectory: apps/flows/api
          wranglerVersion: 4.127.1

      - name: Deploy private Savia Flows
        if: env.SAVIA_FLOWS_PROVISIONED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          workingDirectory: apps/flows/api
          wranglerVersion: 4.127.1

      - name: Deploy savia-agencies
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          workingDirectory: apps/api
          wranglerVersion: 4.127.1

      - name: Deploy savia-auth
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          workingDirectory: apps/auth
          wranglerVersion: 4.127.1

      - name: Deploy private Savia request
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          workingDirectory: apps/savia-request
          wranglerVersion: 4.127.1

      - name: Deploy private Savia connectors
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
          workingDirectory: apps/connector-gateway
          wranglerVersion: 4.127.1

      - name: Build isolated plugin editor assets
        run: pnpm --filter @savia/admin run build:plugin-editor
        env:
          NODE_OPTIONS: "--max-old-space-size=1536"

      - name: Deploy isolated plugin editor runtime
        id: plugin_editor
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config ../plugin-editor-runtime/wrangler.preview.jsonc
          workingDirectory: apps/api
          wranglerVersion: 4.127.1

      - name: Verify isolated runtime and configure admin origin
        run: node scripts/configure-plugin-editor-preview.mjs
        env:
          PLUGIN_EDITOR_DEPLOYMENT_URL: ${{ steps.plugin_editor.outputs.deployment-url }}

      - name: Build admin assets
        run: pnpm --filter @savia/admin run build:assets
        env:
          NODE_OPTIONS: "--max-old-space-size=1536"

      - name: Prepare Office runtime assets
        run: node scripts/prepare-office-runtime.mjs

      - name: Package Office runtime assets
        run: node scripts/package-office-runtime.mjs

      - name: Upload Office runtime assets to preview R2
        run: node scripts/upload-office-runtime.mjs
        env:
          SAVIA_DEPLOY_ENVIRONMENT: preview
          SAVIA_DOCUMENTS_BUCKET: ${{ env.SAVIA_DOCUMENTS_BUCKET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy savia gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: --cwd ../admin deploy --config wrangler.preview.jsonc
          workingDirectory: apps/api
          wranglerVersion: 4.127.1

      - name: Deploy release plugin ZIPs to all workspaces
        run: node scripts/deploy-store-plugins.mjs
        env:
          SAVIA_DEPLOY_ENVIRONMENT: preview
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DATABASE_ID: ${{ env.SAVIA_DOMAIN_D1_ID }}

      - name: Verify deployed gateway
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deployments status --name savia-preview --config wrangler.preview.jsonc
          workingDirectory: apps/api
          wranglerVersion: 4.127.1

      - name: Verify preview responds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-preview-health.mjs

      - name: Verify Flows private bindings and preview policy
        run: node scripts/verify-flows-preview.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record the deployed and verified commit
        env:
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (sha !== process.env.DEPLOYED_SHA) throw new Error('Deployed commit does not match tested commit');
          writeFileSync(process.env.RUNNER_TEMP + '/preview-release.json', JSON.stringify({ sha, repository: process.env.GITHUB_REPOSITORY, environment: 'preview' }));
          NODE

      - name: Publish promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: preview-release
          path: ${{ runner.temp }}/preview-release.json
          retention-days: 30

      - name: Restore preview Workers after an unsuccessful release
        id: restore_recovery
        if: ${{ always() && env.SAVIA_FLOWS_PROVISIONED == 'true' && steps.capture_recovery.outcome == 'success' && (failure() || cancelled()) }}
        timeout-minutes: 3
        run: node scripts/flows-preview-recovery.mjs --action restore --environment preview --metadata "$RUNNER_TEMP/flows-preview-recovery.json" --attempted-agencies "$SAVIA_AGENCIES_PAUSE_ATTEMPTED" --attempted-flows "$SAVIA_FLOWS_PAUSE_ATTEMPTED" --apply
        env:
          SAVIA_DEPLOY_ENVIRONMENT: preview
          SAVIA_FLOWS_PROVISIONED: ${{ env.SAVIA_FLOWS_PROVISIONED }}
          SAVIA_FLOWS_RESOURCES: ${{ env.SAVIA_FLOWS_RESOURCES }}
          SAVIA_AGENCIES_PAUSE_ATTEMPTED: ${{ steps.pause_agencies.outcome == 'success' || steps.pause_agencies.outcome == 'failure' || steps.pause_agencies.outcome == 'cancelled' }}
          SAVIA_FLOWS_PAUSE_ATTEMPTED: ${{ steps.pause_flows.outcome == 'success' || steps.pause_flows.outcome == 'failure' || steps.pause_flows.outcome == 'cancelled' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  plugins:
    name: Publish changed Preview plugins
    needs: plan
    if: needs.plan.outputs.kind == 'plugin'
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    environment:
      name: preview
      url: https://savia-preview.hefesoft.com
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Load existing infrastructure outputs without applying changes
        uses: ./.github/actions/pulumi-infrastructure
        with:
          stack: preview
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}

      - name: Verify isolated preview resources before plugin mutation
        run: node scripts/verify-preview-resources.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Reject superseded plugin publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"

      - name: Write the exact approved plugin plan
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOYED_BASE: ${{ needs.plan.outputs.base }}
          CHANGED_PLUGINS: ${{ needs.plan.outputs.plugins }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.RUNNER_TEMP + '/preview-plugin-plan.json', JSON.stringify({ kind: 'plugin', head: process.env.APPROVED_SHA, base: process.env.DEPLOYED_BASE, plugins: JSON.parse(process.env.CHANGED_PLUGINS) }));
          NODE

      - name: Publish exact plugin versions with a recovery checkpoint
        run: node scripts/publish-preview-plugins.mjs --plan "$RUNNER_TEMP/preview-plugin-plan.json" --recovery "$RUNNER_TEMP/preview-plugin-recovery.json"
        env:
          SAVIA_DEPLOY_ENVIRONMENT: preview
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DATABASE_ID: ${{ env.SAVIA_DOMAIN_D1_ID }}

      - name: Preserve the plugin recovery checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-plugin-recovery
          path: ${{ runner.temp }}/preview-plugin-recovery.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Record verified plugin publication
        env:
          APPROVED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync(process.env.RUNNER_TEMP + '/preview-release.json', JSON.stringify({ sha: process.env.APPROVED_SHA, repository: process.env.GITHUB_REPOSITORY, environment: 'preview', kind: 'plugin' }));
          NODE

      - name: Publish plugin promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: preview-release
          path: ${{ runner.temp }}/preview-release.json
          retention-days: 30
