name: Companion native validation

on:
  pull_request:
    paths:
      - "apps/companion/**"
      - ".github/workflows/companion-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native companion (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @savia/companion build
      - run: cargo test --locked
        working-directory: apps/companion/src-tauri
