name: Pulumi infrastructure

on:
  pull_request:
    paths:
      - infra/pulumi/**
      - packages/tenant-host/**
      - .github/actions/**
      - .github/workflows/pulumi.yml
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to preview (preview or production)
        required: true
        type: choice
        options: [preview, production]
        default: preview
      operation:
        description: Preview, apply, audit, migrate ownership, or retire preview vector state
        type: choice
        options:
          [
            preview,
            apply,
            ownership-audit,
            ownership-migrate,
            retire-vector-state,
            verify-retired-vector-state,
          ]
        default: preview
      apply_retired_vector_state:
        description: Apply the validated targeted preview-stack state refresh (otherwise preview only)
        required: true
        type: boolean
        default: false
      audit_run_id:
        description: Successful ownership-audit run for this exact main commit (migration only)
        required: false
        type: string
      original_workflows:
        description: Reviewed JSON array of original mutating workflow IDs, paths and states (migration only)
        required: false
        type: string

permissions:
  contents: read

jobs:
  runtime-compatibility:
    name: Pulumi minimum Node.js runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.0.0

      - name: Validate dependency-free output and worker rendering
        run: node --test infra/pulumi/outputs.test.mjs infra/pulumi/worker-config.test.mjs

  unit:
    name: Pulumi unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned infrastructure toolchain
        uses: ./.github/actions/install-pulumi

      - name: Verify real CLI behavior without cloud access
        run: node --test infra/pulumi/cli-preflight.integration.mjs

      - name: Test retired Vectorize state safeguards
        run: node --test scripts/retire-vector-state.test.mjs scripts/verify-retired-vector-secrets.test.mjs

      - name: Validate all infrastructure programs
        run: npm --prefix infra/pulumi run typecheck

      - name: Run Pulumi helper tests
        run: node --test infra/pulumi/*.test.mjs

  preview:
    name: Pulumi preview
    needs: [unit, runtime-compatibility]
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'preview' || inputs.operation == 'apply') && (inputs.stack == 'preview' || (inputs.stack == 'production' && vars.PRODUCTION_OPERATIONS_ENABLED == 'true' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: savia-cloudflare-${{ inputs.stack }}
      cancel-in-progress: false
    environment: ${{ inputs.stack == 'production' && 'production-app' || 'preview' }}
    env:
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Required when PULUMI_BACKEND_URL points at an S3-compatible R2
      # backend: Pulumi authenticates it through the AWS SDK.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.268.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Install program dependencies
        working-directory: infra/pulumi
        run: npm ci --ignore-scripts

      - name: Validate infrastructure program
        working-directory: infra/pulumi
        run: npm run typecheck

      - name: Review or apply the infrastructure plan
        env:
          SAVIA_INFRA_STACK: ${{ inputs.stack }}
          SAVIA_INFRA_OPERATION: ${{ inputs.operation }}
        run: node infra/pulumi/deploy-stack.mjs --stack "$SAVIA_INFRA_STACK" "--$SAVIA_INFRA_OPERATION"

  ownership:
    name: Audit or migrate environment ownership
    needs: [unit, runtime-compatibility]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && (inputs.operation == 'ownership-audit' || inputs.operation == 'ownership-migrate') && vars.PRODUCTION_OPERATIONS_ENABLED != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: preview
    permissions:
      contents: read
      actions: write
    concurrency:
      group: savia-cloudflare-preview
      cancel-in-progress: false
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      GH_TOKEN: ${{ github.token }}
      PRODUCTION_OPERATIONS_ENABLED: ${{ vars.PRODUCTION_OPERATIONS_ENABLED }}
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-pulumi
      - name: Audit actual metadata and readable checkpoints
        if: ${{ inputs.operation == 'ownership-audit' }}
        run: |
          mkdir -p "$RUNNER_TEMP/savia-ownership"
          export TMPDIR="$RUNNER_TEMP/savia-ownership"
          node infra/pulumi/environment-ownership.mjs audit --out "$RUNNER_TEMP/savia-ownership/audit"
      - name: Preserve reviewed metadata without checkpoint bodies
        if: ${{ inputs.operation == 'ownership-audit' }}
        uses: actions/upload-artifact@v4
        with:
          name: environment-ownership-audit
          path: ${{ runner.temp }}/savia-ownership/audit/audit.json
          retention-days: 7
      - name: Verify the exact successful audit revision
        if: ${{ inputs.operation == 'ownership-migrate' }}
        env:
          AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
        run: |
          set -euo pipefail
          [[ "$AUDIT_RUN_ID" =~ ^[0-9]+$ ]]
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pulumi.yml" --jq .id)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$AUDIT_RUN_ID" > "$RUNNER_TEMP/ownership-audit-run.json"
          node --input-type=module - "$workflow_id" <<'NODE'
          import {readFileSync} from 'node:fs';
          const run=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/ownership-audit-run.json','utf8'));
          if(run.head_sha!==process.env.GITHUB_SHA||run.head_branch!=='main'||run.event!=='workflow_dispatch'||run.conclusion!=='success'||String(run.workflow_id)!==process.argv[2])throw new Error('Audit must succeed for this exact main revision');
          NODE
          gh run download "$AUDIT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name environment-ownership-audit --dir "$RUNNER_TEMP/reviewed-ownership"
      - name: Move exact backend ownership and adopt without publication
        if: ${{ inputs.operation == 'ownership-migrate' }}
        env:
          SAVIA_ORIGINAL_WORKFLOWS: ${{ inputs.original_workflows }}
        run: |
          mkdir -p "$RUNNER_TEMP/savia-ownership"
          export TMPDIR="$RUNNER_TEMP/savia-ownership"
          node infra/pulumi/environment-ownership.mjs migrate --out "$RUNNER_TEMP/savia-ownership/migration" --reviewed "$RUNNER_TEMP/reviewed-ownership/audit.json"
      - name: Encrypt private custody and recovery evidence
        if: ${{ always() }}
        env:
          SAVIA_FLOWS_BACKUP_KEY: ${{ secrets.SAVIA_FLOWS_BACKUP_KEY }}
        run: |
          if [ -d "$RUNNER_TEMP/savia-ownership" ]; then
            tar -czf "$RUNNER_TEMP/savia-ownership.tar.gz" -C "$RUNNER_TEMP" savia-ownership
            node scripts/encrypt-flows-backup.mjs --action encrypt --input "$RUNNER_TEMP/savia-ownership.tar.gz" --output "$RUNNER_TEMP/savia-ownership.enc"
            rm -f "$RUNNER_TEMP/savia-ownership.tar.gz"
          fi
      - name: Preserve encrypted private evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: environment-ownership-private
          path: ${{ runner.temp }}/savia-ownership.enc
          retention-days: 7
          if-no-files-found: ignore

  retire-vector-state:
    name: Retire preview Vectorize state from Pulumi
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'retire-vector-state' }}
    needs: [unit, runtime-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: preview
    concurrency:
      group: savia-cloudflare-preview
      cancel-in-progress: false
    steps:
      - name: Require the fixed preview stack
        env:
          CHOSEN_STACK: ${{ inputs.stack }}
        run: |
          set -euo pipefail
          test "$CHOSEN_STACK" = preview

      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version 3.268.0
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Build private candidate and import only when selected
        working-directory: infra/pulumi
        env:
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          PULUMI_DIY_BACKEND_DISABLE_CHECKPOINT_BACKUPS: "false"
          APPLY_RETIRED_VECTOR_STATE: ${{ inputs.apply_retired_vector_state }}
        run: |
          set -euo pipefail
          umask 077
          custody="$RUNNER_TEMP/savia-vector-state"
          install -d -m 700 "$custody"
          target='urn:pulumi:preview::savia-cloudflare::pulumi-nodejs:dynamic/vectorize:Index::pages-search'
          stack='organization/savia-cloudflare/preview'

          if ! pulumi stack select "$stack" --non-interactive >"$custody/select.log" 2>&1; then
            node ../../scripts/retire-vector-state.mjs safe-error --operation "Pulumi stack selection" --log "$custody/select.log"
            exit 1
          fi
          if ! pulumi stack export --stack "$stack" --file "$custody/before.private.json" --non-interactive \
            >"$custody/export-before.log" 2>&1; then
            node ../../scripts/retire-vector-state.mjs safe-error --operation "Private checkpoint export" --log "$custody/export-before.log"
            exit 1
          fi
          node ../../scripts/retire-vector-state.mjs transform \
            --checkpoint "$custody/before.private.json" --output "$custody/candidate.private.json" --target "$target"

          if [ "$APPLY_RETIRED_VECTOR_STATE" != "true" ]; then
            echo "The private candidate passed validation; no state was imported."
            exit 0
          fi

          if ! pulumi stack import --file "$custody/candidate.private.json" --stack "$stack" --non-interactive \
            >"$custody/import.private.log" 2>&1; then
            node ../../scripts/retire-vector-state.mjs safe-error --operation "Validated checkpoint import" --log "$custody/import.private.log"
            exit 1
          fi
          if ! pulumi stack export --stack "$stack" --file "$custody/after.private.json" --non-interactive \
            >"$custody/export-after.log" 2>&1; then
            node ../../scripts/retire-vector-state.mjs safe-error --operation "Post-import checkpoint export" --log "$custody/export-after.log"
            exit 1
          fi
          node ../../scripts/verify-retired-vector-secrets.mjs verify-import-secrets \
            --before "$custody/before.private.json" --after "$custody/after.private.json"

  verify-retired-vector-state:
    name: Verify retired Vectorize state without mutation
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'verify-retired-vector-state' && inputs.stack == 'preview' }}
    needs: [unit, runtime-compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: preview
    concurrency:
      group: savia-cloudflare-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare the official backup with the current checkpoint privately
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          umask 077
          custody="$RUNNER_TEMP/savia-vector-verification"
          install -d -m 700 "$custody"
          trap 'rm -rf "$custody"' EXIT
          endpoint='https://08a0d36f8b0357684f83e4bfeb6628b6.r2.cloudflarestorage.com'
          bucket='savia-pulumi-state-preview'
          for snapshot in before after; do
            key='.pulumi/stacks/savia-cloudflare/preview.json'
            if [ "$snapshot" = before ]; then key="$key.bak"; fi
            if ! aws s3api get-object --endpoint-url "$endpoint" --bucket "$bucket" --key "$key" \
              "$custody/$snapshot.private.json" >"$custody/$snapshot.private.log" 2>&1; then
              node scripts/retire-vector-state.mjs safe-error --operation "Private checkpoint read" --log "$custody/$snapshot.private.log"
              exit 1
            fi
          done
          node scripts/verify-retired-vector-secrets.mjs verify-import-secrets \
            --before "$custody/before.private.json" --after "$custody/after.private.json"
