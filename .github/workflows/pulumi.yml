name: Pulumi infrastructure

on:
  pull_request:
    paths:
      - infra/pulumi/**
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to preview (preview or production)
        required: true
        default: preview

permissions:
  contents: read

jobs:
  unit:
    name: Pulumi unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Pulumi helper tests
        run: >
          node --test infra/pulumi/naming.test.mjs
          infra/pulumi/outputs.test.mjs
          infra/pulumi/render-from-outputs.test.mjs
          infra/pulumi/destroy.test.mjs
          infra/pulumi/backup.test.mjs
          infra/pulumi/restore.test.mjs

  preview:
    name: Pulumi preview
    needs: unit
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.stack }}
    env:
      PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Install program dependencies
        working-directory: infra/pulumi
        run: npm install --no-save

      - name: Preview stack
        working-directory: infra/pulumi
        run: |
          pulumi login "$PULUMI_BACKEND_URL"
          pulumi preview --stack "${{ inputs.stack }}"
