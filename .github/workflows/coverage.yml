name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: savia-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage — ${{ matrix.id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: admin-1
            args: --group admin --shard 1/6
          - id: admin-2
            args: --group admin --shard 2/6
          - id: admin-3
            args: --group admin --shard 3/6
          - id: admin-4
            args: --group admin --shard 4/6
          - id: admin-5
            args: --group admin --shard 5/6
          - id: admin-6
            args: --group admin --shard 6/6
          - id: api-1
            args: --group api --shard 1/3
          - id: api-2
            args: --group api --shard 2/3
          - id: api-3
            args: --group api --shard 3/3
          - id: core
            args: --group core
          - id: insurance
            args: --group insurance
          - id: studio-1
            args: --group studio --shard 1/2
          - id: studio-2
            args: --group studio --shard 2/2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run coverage tests
        run: pnpm test:coverage ${{ matrix.args }}

      - name: Upload raw coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-raw-${{ matrix.id }}
          path: coverage/raw/
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Merge coverage reports
    if: always()
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download raw coverage data
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-raw-*
          path: coverage/raw/
          merge-multiple: true

      - name: Merge coverage and write summary
        if: always()
        run: pnpm coverage:report

      - name: Add coverage summary to workflow run
        if: always()
        run: |
          if [ -f coverage/summary.md ]; then
            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary is unavailable; inspect the merge step and raw artifacts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn
          retention-days: 14
