name: Preview environment

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy or destroy (never main)"
        required: true
        type: string
      action:
        description: "Deploy a temporary environment or destroy it"
        required: true
        type: choice
        options: [deploy, destroy]
        default: deploy
      confirm:
        description: "For destroy: repeat the branch name to confirm"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: savia-preview-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    name: Preview ${{ inputs.action }} (${{ inputs.branch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: preview
    env:
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
      PREVIEW_BRANCH: ${{ inputs.branch }}
      PREVIEW_ACTION: ${{ inputs.action }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate trusted preview source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git check-ref-format "refs/heads/$PREVIEW_BRANCH"
          case "$PREVIEW_BRANCH" in
            [mM][aA][iI][nN]|[pP][rR][oO][dD][uU][cC][tT][iI][oO][nN]|[sS][tT][aA][gG][iI][nN][gG])
              echo "::error::Reserved preview branch name."
              exit 1
              ;;
          esac
          case "$PREVIEW_ACTION" in
            deploy)
              git fetch --no-tags --no-recurse-submodules origin "refs/heads/$PREVIEW_BRANCH"
              target_sha="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
              if ! git merge-base --is-ancestor "$target_sha" "$GITHUB_SHA"; then
                echo "::error::Preview source must already belong to the trusted main history."
                exit 1
              fi
              git -c core.hooksPath=/dev/null checkout --detach "$target_sha"
              ;;
            destroy)
              # Keep trusted main tooling; cleanup also works after branch deletion.
              ;;
            *)
              echo "::error::Unsupported preview action."
              exit 1
              ;;
          esac

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/install-pulumi

      - name: Refuse unconfirmed destroy
        if: ${{ inputs.action == 'destroy' && inputs.confirm != inputs.branch }}
        run: |
          echo "Destroy requires confirm to match the branch name." >&2
          exit 1

      - name: Deploy preview environment
        if: ${{ inputs.action == 'deploy' }}
        run: node scripts/preview-deploy.mjs --branch "$PREVIEW_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}

      - name: Destroy preview environment
        if: ${{ inputs.action == 'destroy' && inputs.confirm == inputs.branch }}
        run: node scripts/preview-destroy.mjs --branch "$PREVIEW_BRANCH" --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
