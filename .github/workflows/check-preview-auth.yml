name: Check preview Auth bridge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check authenticated Auth access without initialization
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check diagnostic safeguards
        run: node --test scripts/check-auth-bridge.test.mjs scripts/auth-deployment/worker.test.mjs
      - name: Install pinned diagnostic tool
        run: npm install --prefix "$RUNNER_TEMP/auth-probe-tools" --no-audit --no-fund wrangler@4.127.1
      - name: Check Auth with the existing bridge credential
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SAVIA_MCP_SHARED_SECRET: ${{ secrets.SAVIA_MCP_SHARED_SECRET }}
          AUTH_PROBE_WRANGLER_BIN: ${{ runner.temp }}/auth-probe-tools/node_modules/.bin/wrangler
        run: node scripts/check-auth-bridge.mjs
      - name: Remove diagnostic tool
        if: always()
        run: rm -rf "$RUNNER_TEMP/auth-probe-tools"
